name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.6.7). Leave empty to only build and upload an artifact.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    name: Unit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Run test suite
        shell: pwsh
        run: |
          dotnet build tests/Tests.csproj -v q -nologo
          if ($LASTEXITCODE -ne 0) { throw 'Test build failed' }
          & 'tests/bin/Debug/net9.0-windows/Tests.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Test suite failed' }

  release:
    name: Build and publish release
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install MAUI workload
        run: dotnet workload install maui-windows
      - name: Build release package
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Package zip
        shell: pwsh
        run: |
          $version = (Select-String -Path 'src/App/EncodeFlow.App.csproj' -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          $zip = "TS-Encode-Flow-$version-win-x64.zip"
          Compress-Archive -Path 'build/release/*' -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TS-Encode-Flow-win-x64
          path: build/release/
          # Ship the app files directly; upload-artifact zips them once.
          # (Uploading the release zip here would nest a zip inside a zip.)
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { '${{ inputs.tag }}' }
          gh release create $tag "${{ env.ZIP }}" --title "TS-Encode-Flow $tag" --generate-notes
